<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TripEasy</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="topbar">
    <a class="logo" href="/">✈ TripEasy</a>
    <div>
      <a href="/">Flights</a>
      <a href="/trips">My Trips</a>
      {% if session.user %}
        {{ session.user }} <a href="/logout">Logout</a>
      {% else %}
        <a href="/login">Login</a>
      {% endif %}
    </div>
  </div>

  {% block content %}{% endblock %}
</body>
</html>
